<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#160305">
<title>TandD</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--bg:#070203;--panel:#120507;--panel2:#1b070a;--red:#ff1830;--red2:#a70719;--hot:#ff3d55;--text:#fff7f8;--muted:#b99da1;--line:#40131b;--good:#55e69a;--danger:#ff5366}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;overscroll-behavior-y:none}body{user-select:none}input,textarea{user-select:text}button,input,textarea{font:inherit}button{cursor:pointer;border:0;outline:0}button:focus{outline:none}button::-moz-focus-inner{border:0}
.hidden{display:none!important}.app{min-height:100vh;position:relative;overflow:hidden;background:radial-gradient(circle at 20% 0%,rgba(255,24,48,.10),transparent 32%),radial-gradient(circle at 90% 30%,rgba(255,24,48,.07),transparent 28%),var(--bg)}
.app:before,.app:after{content:"";position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(2px);opacity:.28}.app:before{width:180px;height:180px;left:-70px;top:18%;background:radial-gradient(circle,rgba(255,24,48,.22),transparent 68%);animation:floatA 9s ease-in-out infinite}.app:after{width:240px;height:240px;right:-110px;top:52%;background:radial-gradient(circle,rgba(255,50,70,.18),transparent 68%);animation:floatB 12s ease-in-out infinite}
.app>*{position:relative;z-index:2}@keyframes floatA{50%{transform:translate(28px,-22px) scale(1.08)}}@keyframes floatB{50%{transform:translate(-22px,26px) scale(.92)}}
.auth{min-height:100vh;background:linear-gradient(180deg,rgba(10,1,2,.55),rgba(10,1,2,.95)),url('login_bg.jpg') center/cover fixed;display:flex;align-items:center;justify-content:center;padding:24px}.auth-card{width:min(430px,100%);background:rgba(15,4,5,.88);border:1px solid rgba(255,44,64,.24);backdrop-filter:blur(18px);border-radius:28px;padding:26px;box-shadow:0 25px 80px #000,0 0 50px rgba(255,24,48,.08)}.brand-img{width:92px;height:92px;object-fit:cover;border-radius:18px;display:block;margin:0 auto 15px;box-shadow:0 0 30px rgba(255,24,48,.22)}.auth h1{text-align:center;font:700 36px "Space Grotesk";margin:0}.sub{text-align:center;color:#d5c8c9;margin:6px 0 22px}.field{margin:11px 0}.field label{display:block;color:#d9c8ca;font-size:13px;margin-bottom:6px}.field input,.field textarea,.searchbox{width:100%;background:#0b0203;color:#fff;border:1px solid #5a2529;border-radius:14px;padding:14px;outline:none}.field input:focus,.field textarea:focus,.searchbox:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,24,48,.09)}
.primary,.follow{background:linear-gradient(135deg,var(--red),#c60d22);color:white;padding:14px;border-radius:14px;font-weight:800;box-shadow:0 8px 24px rgba(255,24,48,.18)}.primary{width:100%;margin-top:9px}.secondary{width:100%;background:rgba(255,24,48,.035);color:#ff6876;border:1px solid #70272c;padding:13px;border-radius:14px;margin-top:10px}.tiny{text-align:center;font-size:12px;color:#9c898b;margin-top:14px}.err{color:#ff747a;font-size:13px;margin-top:9px}
.top{position:sticky;top:0;z-index:20;background:rgba(9,3,4,.86);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,24,48,.18);height:64px;display:flex;align-items:center;padding:0 14px;gap:12px;box-shadow:0 8px 28px rgba(0,0,0,.18)}.top img{width:42px;height:42px;object-fit:cover;border-radius:10px}.top .title{font:700 22px "Space Grotesk";flex:1;text-shadow:0 0 14px rgba(255,24,48,.4)}.iconbtn{background:transparent;color:#fff;font-size:21px;padding:8px;position:relative}.badge{position:absolute;right:0;top:1px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--red);font-size:10px;line-height:16px;text-align:center;box-shadow:0 0 12px rgba(255,24,48,.7)}
.page{max-width:760px;margin:auto;padding:14px 14px 96px}.tabs{display:flex;gap:8px;margin:5px 0 14px;overflow:auto}.tab{white-space:nowrap;background:#1a080a;color:#cbbabc;padding:9px 14px;border-radius:999px;border:1px solid #351015}.tab.active{background:var(--red);color:#fff;box-shadow:0 0 18px rgba(255,24,48,.24)}.card{background:linear-gradient(145deg,rgba(25,7,10,.94),rgba(13,4,6,.96));border:1px solid rgba(255,24,48,.18);border-radius:20px;margin:12px 0;padding:15px;box-shadow:0 12px 34px rgba(0,0,0,.22)}.card:hover{border-color:rgba(255,24,48,.3)}.posthead{display:flex;gap:10px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#351114}.who{flex:1}.who b{font-size:15px}.who small{display:block;color:#9f8c8e}.postbody{font-size:16px;line-height:1.45;margin:13px 0;white-space:pre-wrap}.media{width:100%;max-height:560px;object-fit:cover;border-radius:14px;background:#070203;border:1px solid rgba(255,24,48,.10)}.actions{display:flex;justify-content:space-between;margin-top:10px;border-top:1px solid rgba(255,24,48,.08);padding-top:6px}.action{background:transparent;color:#bca9ab;padding:8px 7px;border-radius:10px;transition:transform .12s ease,color .12s ease,background .12s ease}.action.on{color:#ff596a;background:rgba(255,24,48,.08)}
.bottom{position:fixed;bottom:0;left:0;right:0;height:70px;background:rgba(13,4,5,.90);backdrop-filter:blur(16px);border-top:1px solid rgba(255,24,48,.18);display:flex;justify-content:space-around;z-index:50}.nav{background:transparent;color:#9d8c8e;min-width:58px;transition:transform .12s}.nav.active{color:#ff4249;text-shadow:0 0 12px rgba(255,24,48,.55)}.nav strong{font-size:20px}.nav span{display:block;font-size:11px;margin-top:2px}.compose{position:fixed;right:18px;bottom:84px;background:linear-gradient(135deg,#ff1830,#c80d22);color:#fff;width:58px;height:58px;border-radius:50%;font-size:28px;box-shadow:0 8px 25px #000,0 0 28px rgba(255,24,48,.3);z-index:40}
.profile-cover{height:150px;border-radius:18px 18px 0 0;background:#360b0f center/cover}.profilebox{padding:0 15px 15px;position:relative}.profilebox .avatar{width:82px;height:82px;border:4px solid var(--panel);margin-top:-42px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.grid img,.grid video{width:100%;aspect-ratio:1;object-fit:cover;background:#1b0709;border-radius:5px}.result{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.76);backdrop-filter:blur(5px);z-index:100;display:flex;align-items:flex-end}.sheet{background:linear-gradient(160deg,#190709,#0e0305);width:100%;max-height:90vh;overflow:auto;border:1px solid rgba(255,24,48,.2);border-bottom:0;border-radius:24px 24px 0 0;padding:18px;box-shadow:0 -15px 50px rgba(0,0,0,.45)}.sheet h2{margin-top:0;font-family:"Space Grotesk"}.close{float:right;background:#2a0b0e;color:#fff;border-radius:50%;width:34px;height:34px}.empty{text-align:center;color:#9f8c8e;padding:35px 10px}.sectiontitle{font:700 24px "Space Grotesk";margin:12px 0}.statrow{display:flex;gap:20px;color:#cdbfc0}.statrow b{color:#fff}.chat{height:60vh;overflow:auto;padding:8px}.bubble{max-width:78%;padding:10px 13px;border-radius:16px;margin:7px 0;background:#2b0d10;border:1px solid rgba(255,24,48,.08)}.mine{margin-left:auto;background:var(--red);border-color:transparent}.chatbar{display:flex;gap:8px}.chatbar input{flex:1;background:#0b0203;border:1px solid #5a2529;color:#fff;border-radius:14px;padding:12px}.upload{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#24090c,#160507);border:1px solid #6b252b;border-radius:16px;padding:12px;color:#fff;cursor:pointer}.upload-icon{width:44px;height:44px;border-radius:12px;background:#ff1720;display:grid;place-items:center;font-size:22px;font-weight:800}.upload-info{flex:1}.upload-title{font-weight:700}.upload-name{font-size:12px;color:#bdaeb0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.upload input{display:none}.help-card{border:1px solid rgba(255,24,48,.2);background:linear-gradient(145deg,#21080c,#100406);border-radius:18px;padding:16px}.website{display:inline-block;margin-top:8px;color:#ff6674;text-decoration:none;word-break:break-all}.website:hover{text-decoration:underline}.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-130%);min-width:min(420px,calc(100% - 28px));max-width:calc(100% - 28px);background:linear-gradient(135deg,#2a080d,#130305);color:#fff;border:1px solid rgba(255,24,48,.55);padding:12px 16px;border-radius:15px;z-index:250;box-shadow:0 10px 35px rgba(0,0,0,.55),0 0 25px rgba(255,24,48,.14);font-weight:700;opacity:0;transition:transform .22s cubic-bezier(.2,.9,.2,1),opacity .18s}.toast.show{transform:translate(-50%,0);opacity:1}.toast.ok{border-color:rgba(85,230,154,.55)}.toast.bad{border-color:rgba(255,83,102,.7)}
@keyframes tuing{0%{transform:scale(1)}45%{transform:scale(.93)}72%{transform:scale(1.045)}100%{transform:scale(1)}}.pressing{animation:tuing .22s ease-out}.action,.primary,.secondary,.follow,.iconbtn,.nav,.compose,.close,.tab,.upload{touch-action:manipulation}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast hidden"></div>

<script>
const C=window.TANDD_CONFIG||{};
C.anonKey=localStorage.getItem('tandd_key')||C.anonKey||'';
const sb=(window.supabase&&C.anonKey&&!C.anonKey.startsWith("PASTE_"))?window.supabase.createClient(C.url,C.anonKey):null;
const A='';
let state={session:null,profile:null,page:'home',feed:'latest',search:'',posts:[],profileView:null,conversation:null};
const $=id=>document.getElementById(id);
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function showFileName(input,target){let f=input.files&&input.files[0];if($(target))$(target).textContent=f?f.name:'Belum ada file dipilih'}
let toastTimer=null;
function toast(s,type='ok'){let t=$('toast');if(!t)return;t.textContent=(type==='bad'?'×  ':'✓  ')+s;t.className='toast '+(type==='bad'?'bad':'ok');clearTimeout(toastTimer);requestAnimationFrame(()=>t.classList.add('show'));toastTimer=setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.classList.add('hidden'),220)},2600)}
function press(el){if(!el)return;el.classList.remove('pressing');void el.offsetWidth;el.classList.add('pressing');setTimeout(()=>el.classList.remove('pressing'),240)}
function deadline(p,ms=15000){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('Permintaan terlalu lama. Periksa koneksi internet.')),ms))])}
async function signedMedia(path){if(!path)return null;try{let r=await deadline(sb.storage.from('media').createSignedUrl(path,60*60),15000);if(r.error)throw r.error;return r.data?.signedUrl||null}catch(e){console.warn('media url',e);return null}}
async function hydrateMedia(rows){return await Promise.all((rows||[]).map(async p=>{if(p.media_path){p.media_url=await signedMedia(p.media_path)}return p}))}
async function refreshNotificationBadge(){if(!sb||!state.profile)return;let {count,error}=await sb.from('notifications').select('id',{count:'exact',head:true}).eq('user_id',state.profile.id).is('read_at',null);let b=$('notifBadge');if(b&&!error){b.textContent=count||'';b.classList.toggle('hidden',!(count>0))}}
function normalizeWebsite(u){u=(u||'').trim();if(!u)return '';return /^https?:\/\//i.test(u)?u:'https://'+u}
function avatar(p){return p?.avatar_url||A+'default_avatar.png'}
function isConfigured(){return !!sb}
function shell(content){setTimeout(refreshNotificationBadge,0);return `<div class="app"><header class="top"><img src="${A}logo_app.jpg"><div class="title">TandD</div><button class="iconbtn" onclick="press(this);openNotifications()">♢<span id="notifBadge" class="badge hidden"></span></button><button class="iconbtn" onclick="press(this);logout()">⎋</button></header><main class="page">${content}</main><button class="compose" onclick="press(this);openCreate()">+</button><nav class="bottom">${[['home','⌂','Home'],['search','⌕','Search'],['create','＋','Create'],['videos','▶','Videos'],['profile','◉','Profile']].map(x=>`<button class="nav ${state.page===x[0]?'active':''}" onclick="press(this);go('${x[0]}')"><strong>${x[1]}</strong><span>${x[2]}</span></button>`).join('')}</nav></div>`}
async function init(){
 if(!isConfigured()){renderConfig();return}
 const {data:{session}}=await sb.auth.getSession(); state.session=session;
 if(!session){renderAuth();return}
 await loadProfile(); renderPage();
 sb.auth.onAuthStateChange((_e,s)=>{state.session=s;if(!s)renderAuth()});
}
function renderConfig(){ $('root').innerHTML=`<div class="auth"><div class="auth-card"><img class="brand-img" src="${A}logo_app.jpg"><h1>TandD</h1><p class="sub">Konfigurasi Supabase belum diisi</p><div class="field"><label>Anon / Publishable Key</label><input id="cfg" placeholder="Tempel key Supabase di config.js"></div><button class="primary" onclick="saveKey()">Simpan di perangkat</button><p class="tiny">URL Supabase sudah tertanam. Gunakan anon/publishable key, bukan service_role.</p></div></div>`}
function saveKey(){let k=$('cfg').value.trim();if(!k)return toast('Key masih kosong');localStorage.tandd_key=k;C.anonKey=k;location.reload()}
function renderAuth(){ $('root').innerHTML=`<div class="auth"><div class="auth-card"><img class="brand-img" src="${A}logo_app.jpg"><h1>Masuk ke TandD</h1><p class="sub">T = Terrain · D = Dynimate</p><div class="field"><label>Email</label><input id="email" type="email" placeholder="nama@email.com"></div><div class="field"><label>Password</label><input id="pass" type="password" placeholder="Minimal 6 karakter"></div><button class="primary" onclick="login()">MASUK</button><button class="secondary" onclick="register()">DAFTAR AKUN</button><p class="tiny">Semua fitur TandD terhubung ke Supabase.</p><div id="autherr" class="err"></div></div></div>`}
async function login(){let email=$('email').value.trim(),password=$('pass').value; if(!email||!password)return err('Isi email dan password.');let {error}=await sb.auth.signInWithPassword({email,password});if(error)err(error.message);else{await loadProfile();state.page='home';renderPage()}}
async function register(){let email=$('email').value.trim(),password=$('pass').value;if(password.length<6)return err('Password minimal 6 karakter.');let {error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:'tandd://auth/callback'}});if(error)err(error.message);else toast('Akun dibuat. Cek email. Setelah verifikasi, TandD akan membuka aplikasi kembali.')}
function err(s){$('autherr').textContent=s}
async function logout(){await sb.auth.signOut();state.session=null;renderAuth()}
async function loadProfile(){let {data,error}=await sb.from('profiles').select('*').eq('id',state.session.user.id).single();if(error){console.error(error);toast(error.message)}state.profile=data}
async function go(p){state.page=p;if(p==='home')await loadFeed();renderPage()}
function renderPage(){if(state.page==='home')renderHome();else if(state.page==='search')renderSearch();else if(state.page==='videos')renderVideos();else if(state.page==='profile')renderProfile(state.profile);else if(state.page==='saved')renderSaved();else if(state.page==='create')openCreate()}
async function loadFeed(){let q=sb.from('posts').select('*,profiles!posts_author_id_fkey(id,username,display_name,avatar_url),likes(count),comments(count),reposts(count)').order('created_at',{ascending:false}).limit(50);if(state.feed==='following'){let {data:f,error}=await sb.from('follows').select('following_id').eq('follower_id',state.session.user.id);if(error){toast(error.message,'bad');state.posts=[];return}let ids=(f||[]).map(x=>x.following_id);if(ids.length)q=q.in('author_id',ids);else{state.posts=[];return}}let {data,error}=await q;if(error){toast(error.message,'bad');state.posts=[];return}state.posts=await hydrateMedia(data||[])}
function postCard(p){return `<article class="card" id="post-${p.id}"><div class="posthead"><img class="avatar" src="${avatar(p.profiles)}"><div class="who"><b>${esc(p.profiles?.display_name||p.profiles?.username||'Pengguna')}</b><small>@${esc(p.profiles?.username||'user')} · ${new Date(p.created_at).toLocaleString('id-ID')}</small></div><button class="iconbtn" onclick="press(this);openPostMenu('${p.id}')">⋯</button></div><div class="postbody">${esc(p.content||'')}</div>${p.media_url?media(p):''}<div class="actions"><button class="action" onclick="press(this);likePost('${p.id}',this)">♡ <span class="count">${p.likes?.[0]?.count||0}</span></button><button class="action" onclick="press(this);openComments('${p.id}')">◌ <span class="count">${p.comments?.[0]?.count||0}</span></button><button class="action" onclick="press(this);repost('${p.id}')">↻ <span class="count">${p.reposts?.[0]?.count||0}</span></button><button class="action" onclick="press(this);bookmark('${p.id}',this)">▢</button><button class="action" onclick="press(this);sharePost('${p.id}')">↗</button></div></article>`}
function media(p){if(p.media_type==='video')return `<video class="media" controls playsinline src="${esc(p.media_url)}"></video>`;return `<img class="media" src="${esc(p.media_url)}" loading="lazy">`}
async function renderHome(){await loadFeed();$('root').innerHTML=shell(`<div class="sectiontitle">Beranda</div><div class="tabs"><button class="tab ${state.feed==='latest'?'active':''}" onclick="state.feed='latest';renderPage()">Terbaru</button><button class="tab ${state.feed==='following'?'active':''}" onclick="state.feed='following';renderPage()">Mengikuti</button><button class="tab" onclick="state.feed='trending';renderPage()">Trending</button></div>${state.posts.length?state.posts.map(postCard).join(''):'<div class="empty">Belum ada konten. Dunia maya sedang terlalu sepi.</div>'}`)}
async function renderSearch(){let q=state.search.trim();let results=[];if(q){let {data}=await sb.from('profiles').select('*').or(`username.ilike.%${q}%,display_name.ilike.%${q}%`).limit(30);results=data||[]}$('root').innerHTML=shell(`<div class="sectiontitle">Cari</div><input class="searchbox" id="searchInput" value="${esc(state.search)}" placeholder="Cari akun atau @username" onkeydown="if(event.key==='Enter'){state.search=this.value;renderSearch()}">${q?results.map(p=>`<div class="result" onclick="viewUser('${p.id}')"><img class="avatar" src="${avatar(p)}"><div><b>${esc(p.display_name||p.username)}</b><div style="color:#9f8c8e">@${esc(p.username)}</div></div></div>`).join(''):'<div class="empty">Cari akun TandD.</div>'}`)}
async function renderVideos(){let {data,error}=await sb.from('posts').select('*,profiles!posts_author_id_fkey(id,username,display_name,avatar_url)').eq('media_type','video').order('created_at',{ascending:false}).limit(30);if(error){toast(error.message,'bad');data=[]}data=await hydrateMedia(data||[]);$('root').innerHTML=shell(`<div class="sectiontitle">Videos</div>${(data||[]).map(p=>`<div class="card"><div class="posthead"><img class="avatar" src="${avatar(p.profiles)}"><div class="who"><b>${esc(p.profiles?.display_name||p.profiles?.username)}</b><small>@${esc(p.profiles?.username)}</small></div></div><div class="postbody">${esc(p.content||'')}</div>${p.media_url?`<video class="media" controls playsinline src="${esc(p.media_url)}"></video>`:''}</div>`).join('')||'<div class="empty">Belum ada video.</div>'}`)}
async function renderProfile(p){if(!p)return;let {data:posts,error:postError}=await sb.from('posts').select('*').eq('author_id',p.id).order('created_at',{ascending:false});if(postError){toast(postError.message,'bad');posts=[]}posts=await hydrateMedia(posts||[]);let {count:followers}=await sb.from('follows').select('*',{count:'exact',head:true}).eq('following_id',p.id);let {count:following}=await sb.from('follows').select('*',{count:'exact',head:true}).eq('follower_id',p.id);let isSelf=p.id===state.profile.id;let followingMe=false;if(!isSelf){let x=await sb.from('follows').select('id').eq('follower_id',state.profile.id).eq('following_id',p.id).maybeSingle();followingMe=!!x.data}let website=normalizeWebsite(p.website);$('root').innerHTML=shell(`<div class="card" style="padding:0;overflow:hidden"><div class="profile-cover" style="background-image:url('${esc(p.banner_url||A+'login_bg.jpg')}')"></div><div class="profilebox"><img class="avatar" src="${avatar(p)}"><div style="display:flex;justify-content:flex-end;margin-top:-35px">${isSelf?'<button class="follow" onclick="press(this);editProfile()">Edit profil</button>':`<button class="follow" onclick="press(this);toggleFollow('${p.id}',${followingMe})">${followingMe?'Mengikuti':'Ikuti'}</button><button class="secondary" style="width:auto;margin:0 0 0 7px;padding:10px 14px" onclick="press(this);startChat('${p.id}')">Chat</button>`}</div><h2 style="margin-bottom:2px">${esc(p.display_name||p.username)}</h2><div style="color:#9f8c8e">@${esc(p.username)}</div><p>${esc(p.bio||'')}</p>${website?`<a class="website" href="${esc(website)}" target="_self">${esc(p.website)}</a>`:''}<div class="statrow" style="margin-top:12px"><span><b>${followers||0}</b> pengikut</span><span><b>${following||0}</b> mengikuti</span><span><b>${posts.length}</b> posting</span></div>${isSelf?'<button class="secondary" onclick="press(this);go(\'saved\')">🔖 Postingan Tersimpan</button><button class="secondary" onclick="press(this);openSupport()">Customer Service</button>':''}</div></div><div class="grid">${posts.filter(x=>x.media_url).map(x=>x.media_type==='video'?`<video controls playsinline src="${esc(x.media_url)}"></video>`:`<img src="${esc(x.media_url)}" loading="lazy">`).join('')}</div>${!posts.filter(x=>x.media_url).length?'<div class="empty">Belum ada media.</div>':''}`)}
async function viewUser(id){let {data}=await sb.from('profiles').select('*').eq('id',id).single();state.profileView=data;state.page='profile';await renderProfile(data)}
async function toggleFollow(id,isFollowing){if(isFollowing){await sb.from('follows').delete().eq('follower_id',state.profile.id).eq('following_id',id)}else{await sb.from('follows').insert({follower_id:state.profile.id,following_id:id});await notify(id,'follow',null)}await renderProfile(state.profileView||state.profile)}
async function likePost(id,btn){let {data,error}=await sb.from('likes').select('id').eq('post_id',id).eq('user_id',state.profile.id).maybeSingle();if(error)return toast(error.message,'bad');if(data){let r=await sb.from('likes').delete().eq('id',data.id);if(r.error)return toast(r.error.message,'bad');btn.classList.remove('on')}else{let r=await sb.from('likes').insert({post_id:id,user_id:state.profile.id});if(r.error)return toast(r.error.message,'bad');btn.classList.add('on')}let n=Number(btn.querySelector('.count').textContent)||0;btn.querySelector('.count').textContent=data?Math.max(0,n-1):n+1} 
async function repost(id){let {data,error}=await sb.from('reposts').select('id').eq('post_id',id).eq('user_id',state.profile.id).maybeSingle();if(error)return toast(error.message,'bad');if(data)return toast('Sudah pernah repost');let r=await sb.from('reposts').insert({post_id:id,user_id:state.profile.id});if(r.error)return toast(r.error.message,'bad');toast('Repost berhasil')}
async function bookmark(id,btn){let {data,error}=await sb.from('bookmarks').select('id').eq('post_id',id).eq('user_id',state.profile.id).maybeSingle();if(error)return toast(error.message,'bad');if(data){let r=await sb.from('bookmarks').delete().eq('id',data.id);if(r.error)return toast(r.error.message,'bad');if(btn)btn.classList.remove('on');toast('Postingan dihapus dari Simpanan')}else{let r=await sb.from('bookmarks').insert({post_id:id,user_id:state.profile.id});if(r.error)return toast(r.error.message,'bad');if(btn)btn.classList.add('on');toast('Postingan disimpan')}}
async function sharePost(id){let url='tandd://post/'+id;try{if(navigator.share)await navigator.share({title:'TandD',text:'Lihat postingan ini di TandD',url});else{await navigator.clipboard.writeText(url);toast('Tautan postingan disalin')}}catch(e){if(e?.name!=='AbortError')toast('Gagal membagikan postingan','bad')}}
async function openComments(id){let {data}=await sb.from('comments').select('*,profiles!comments_user_id_fkey(display_name,username,avatar_url)').eq('post_id',id).order('created_at');openModal(`<h2>Komentar <button class="close" onclick="closeModal()">×</button></h2><div id="comments">${(data||[]).map(c=>`<div class="result"><img class="avatar" src="${avatar(c.profiles)}"><div><b>${esc(c.profiles?.display_name||c.profiles?.username)}</b><div>${esc(c.content)}</div></div></div>`).join('')}</div><div class="chatbar"><input id="commentText" placeholder="Tulis komentar..."><button class="follow" onclick="addComment('${id}')">Kirim</button></div>`)}
async function addComment(id){let t=$('commentText')?.value.trim();if(!t)return;let r=await sb.from('comments').insert({post_id:id,user_id:state.profile.id,content:t});if(r.error)return toast('Komentar gagal: '+r.error.message,'bad');toast('Komentar berhasil');closeModal();openComments(id)}
function openPostMenu(id){openModal(`<h2>Postingan <button class="close" onclick="closeModal()">×</button></h2><button class="secondary" onclick="deletePost('${id}')">Hapus postingan</button><button class="secondary" onclick="reportPost('${id}')">Laporkan</button>`)}
async function deletePost(id){await sb.from('posts').delete().eq('id',id).eq('author_id',state.profile.id);closeModal();renderPage()}
async function reportPost(id){let r=prompt('Alasan laporan:');if(r)await sb.from('reports').insert({reporter_id:state.profile.id,post_id:id,reason:r});closeModal();toast('Laporan dikirim')}
function openModal(content){let m=document.createElement('div');m.id='modal';m.className='modal';m.innerHTML=`<div class="sheet">${content}</div>`;document.body.appendChild(m)}
function closeModal(){$('modal')?.remove()}
function openCreate(){openModal(`<h2>Buat konten <button class="close" onclick="closeModal()">×</button></h2><div class="field"><label>Teks</label><textarea id="newText" rows="5" placeholder="Apa yang sedang kamu pikirkan?"></textarea></div><div class="field"><label>Foto / Video</label><label class="upload" for="mediaFile"><span class="upload-icon">＋</span><span class="upload-info"><span class="upload-title">Pilih foto atau video</span><span class="upload-name" id="mediaName">Belum ada file dipilih</span></span><input id="mediaFile" type="file" accept="image/*,video/*" onchange="showFileName(this,'mediaName')"></label></div><button class="primary" onclick="createPost()">Publikasikan</button>`)}
async function createPost(){let content=$('newText')?.value.trim()||'',file=$('mediaFile')?.files?.[0]||null;if(!content&&!file)return toast('Konten masih kosong','bad');let btn=document.querySelector('#modal .primary');if(btn){btn.disabled=true;btn.textContent='Mengunggah...'}try{let media_type=null,media_path=null;if(file){if(file.size>100*1024*1024)throw new Error('File terlalu besar. Maksimal 100 MB.');let ext=(file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');media_path=`${state.profile.id}/${crypto.randomUUID()}.${ext}`;media_type=file.type.startsWith('video/')?'video':'image';let r=await deadline(sb.storage.from('media').upload(media_path,file,{upsert:false,contentType:file.type||'application/octet-stream'}),120000);if(r.error)throw r.error}let r=await deadline(sb.from('posts').insert({author_id:state.profile.id,content,media_url:null,media_type,media_path}).select().single(),20000);if(r.error)throw r.error;closeModal();toast('Konten berhasil dipublikasikan');state.page='home';await renderPage()}catch(e){console.error(e);toast('Upload gagal: '+(e.message||e),'bad')}finally{if(btn){btn.disabled=false;btn.textContent='Publikasikan'}}}
function editProfile(){openModal(`<h2>Edit profil <button class="close" onclick="closeModal()">×</button></h2><div class="field"><label>Nama</label><input id="ep_name" value="${esc(state.profile.display_name||'')}"></div><div class="field"><label>Username</label><input id="ep_user" value="${esc(state.profile.username||'')}"></div><div class="field"><label>Bio</label><textarea id="ep_bio" rows="4">${esc(state.profile.bio||'')}</textarea></div><div class="field"><label>Website</label><input id="ep_web" value="${esc(state.profile.website||'')}"></div><div class="field"><label>Foto profil</label><label class="upload" for="ep_avatar"><span class="upload-icon">⌁</span><span class="upload-info"><span class="upload-title">Ganti foto profil</span><span class="upload-name" id="avatarName">Gunakan foto dari perangkat</span></span><input id="ep_avatar" type="file" accept="image/*" onchange="showFileName(this,'avatarName')"></label></div><div class="field"><label>Banner</label><label class="upload" for="ep_banner"><span class="upload-icon">▣</span><span class="upload-info"><span class="upload-title">Ganti banner profil</span><span class="upload-name" id="bannerName">Gunakan gambar dari perangkat</span></span><input id="ep_banner" type="file" accept="image/*" onchange="showFileName(this,'bannerName')"></label></div><button class="primary" onclick="saveProfile()">Simpan perubahan</button>`)}
async function saveProfile(){let patch={display_name:$('ep_name').value.trim(),username:$('ep_user').value.trim().toLowerCase(),bio:$('ep_bio').value.trim(),website:$('ep_web').value.trim()};try{for(let [id,field] of [['ep_avatar','avatar_url'],['ep_banner','banner_url']]){let f=$(id).files[0];if(f){let ext=f.name.split('.').pop();let path=`${state.profile.id}/${field}-${Date.now()}.${ext}`;let bucket=field==='avatar_url'?'avatars':'banners';let r=await deadline(sb.storage.from(bucket).upload(path,f,{upsert:true,contentType:f.type}),60000);if(r.error)throw r.error;let base=sb.storage.from(bucket).getPublicUrl(path);patch[field]=base.data.publicUrl}}let {error}=await deadline(sb.from('profiles').update(patch).eq('id',state.profile.id),20000);if(error)throw error;await loadProfile();closeModal();toast('Perubahan berhasil disimpan');renderProfile(state.profile)}catch(e){toast('Gagal menyimpan: '+(e.message||e),'bad')}}
async function openNotifications(){let {data,error}=await sb.from('notifications').select('*').eq('user_id',state.profile.id).order('created_at',{ascending:false}).limit(50);if(error)return toast(error.message,'bad');let unread=(data||[]).filter(n=>!n.read_at).map(n=>n.id);if(unread.length){await sb.from('notifications').update({read_at:new Date().toISOString()}).in('id',unread)}openModal(`<h2>Notifikasi <button class="close" onclick="press(this);closeModal()">×</button></h2>${(data||[]).map(n=>`<div class="result"><div><b>${esc(n.type==='like'?'Suka':n.type==='comment'?'Komentar':n.type==='repost'?'Repost':n.type==='follow'?'Pengikut':n.type==='message'?'Pesan':'Aktivitas')}</b><div>${esc(n.payload?.message||'Aktivitas baru')}</div><small>${new Date(n.created_at).toLocaleString('id-ID')}</small></div></div>`).join('')||'<div class="empty">Belum ada notifikasi.</div>'}`);refreshNotificationBadge()}
async function renderSaved(){let {data,error}=await sb.from('bookmarks').select('post_id,posts(*,profiles!posts_author_id_fkey(id,username,display_name,avatar_url),likes(count),comments(count),reposts(count))').eq('user_id',state.profile.id).order('created_at',{ascending:false});if(error){toast(error.message,'bad');data=[]}let posts=(data||[]).map(x=>x.posts).filter(Boolean);posts=await hydrateMedia(posts);$('root').innerHTML=shell(`<div class="sectiontitle">Postingan Tersimpan</div>${posts.length?posts.map(postCard).join(''):'<div class="empty">Belum ada postingan tersimpan.</div>'}`)}
function openSupport(){openModal(`<div class="help-card"><h2>Customer Service <button class="close" onclick="press(this);closeModal()">×</button></h2><p>Mau melapor atau butuh bantuan?</p><p style="color:#b99da1">Laporkan bug, masalah akun, konten, atau hal lainnya kepada Customer Service TandD.</p><a class="follow" style="display:block;text-align:center;text-decoration:none" href="https://wa.me/6285185083991?text=Halo%20TandD%2C%20saya%20ingin%20melapor%20atau%20meminta%20bantuan." target="_self">Hubungi Customer Service</a></div>`)}
async function notify(userId,type,postId){if(userId===state.profile.id)return;await sb.from('notifications').insert({user_id:userId,actor_id:state.profile.id,type,payload:postId?{post_id:postId,message:`${state.profile.display_name||state.profile.username} berinteraksi dengan postinganmu.`}:{message:`${state.profile.display_name||state.profile.username} mulai mengikuti kamu.`}})}
async function startChat(other){try{if(!state.profile?.id)return toast('Sesi login tidak ditemukan','bad');let r=await deadline(sb.rpc('find_or_create_dm',{other_user:other}),20000);if(r.error)throw r.error;if(!r.data)throw new Error('Conversation tidak ditemukan');state.conversation=r.data;await openChat(other)}catch(e){console.error(e);toast('Chat gagal dibuka: '+(e.message||e),'bad')}}
async function openChat(other){try{let opR=await deadline(sb.from('profiles').select('*').eq('id',other).single(),15000);if(opR.error)throw opR.error;let msgR=await deadline(sb.from('messages').select('*,profiles!messages_sender_id_fkey(display_name,username)').eq('conversation_id',state.conversation).order('created_at'),15000);if(msgR.error)throw msgR.error;let op=opR.data,msgs=msgR.data||[];openModal(`<h2>Chat · ${esc(op.display_name||op.username)} <button class="close" onclick="press(this);closeModal()">×</button></h2><div class="chat" id="chat">${msgs.map(m=>`<div class="bubble ${m.sender_id===state.profile.id?'mine':''}">${esc(m.content||'')}</div>`).join('')}</div><div class="chatbar"><input id="chatText" placeholder="Tulis pesan..." onkeydown="if(event.key==='Enter')sendMessage()"><button class="follow" onclick="press(this);sendMessage()">Kirim</button></div>`);setTimeout(()=>{let c=$('chat');if(c)c.scrollTop=c.scrollHeight},50);if(state.chatChannel)sb.removeChannel(state.chatChannel);state.chatChannel=sb.channel('chat-'+state.conversation).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`conversation_id=eq.${state.conversation}`},payload=>{let m=payload.new;if($('chat')){$('chat').insertAdjacentHTML('beforeend',`<div class="bubble ${m.sender_id===state.profile.id?'mine':''}">${esc(m.content||'')}</div>`);$('chat').scrollTop=$('chat').scrollHeight}}).subscribe()}catch(e){console.error(e);toast('Chat gagal dimuat: '+(e.message||e),'bad')}}
async function sendMessage(){let t=$('chatText')?.value.trim();if(!t)return;try{let r=await deadline(sb.from('messages').insert({conversation_id:state.conversation,sender_id:state.profile.id,content:t}),15000);if(r.error)throw r.error;$('chatText').value='';toast('Pesan berhasil dikirim')}catch(e){toast('Pesan gagal dikirim: '+(e.message||e),'bad')}}
async function openSharedPost(id){try{let {data,error}=await sb.from('posts').select('*,profiles!posts_author_id_fkey(id,username,display_name,avatar_url),likes(count),comments(count),reposts(count)').eq('id',id).single();if(error)throw error;let [p]=await hydrateMedia([data]);state.posts=[p];state.page='home';$('root').innerHTML=shell(`<div class="sectiontitle">Postingan</div>${postCard(p)}`)}catch(e){toast('Postingan tidak ditemukan: '+(e.message||e),'bad')}}
async function handleSharedPost(){let m=location.hash.match(/^#post=([0-9a-f-]{36})$/i);if(m&&state.session){await openSharedPost(m[1]);history.replaceState(null,'',location.pathname+location.search)}}
init();
</script>
